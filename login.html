<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Forgotten Depths - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0f0f1a 100%);
        }
        
        .card-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn-google {
            background: white;
            transition: all 0.3s ease;
        }
        
        .btn-google:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        
        .floating {
            animation: floating 3s ease-in-out infinite;
        }
        
        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo and Title -->
        <div class="text-center mb-8">
            <div class="text-6xl mb-4 floating">⛏️</div>
            <h1 class="text-3xl font-bold text-white mb-2">The Forgotten Depths</h1>
            <p class="text-gray-400">Explora, resuelve, descubre</p>
        </div>
        
        <!-- Login Card -->
        <div class="card-glass rounded-2xl p-8">
            <h2 class="text-xl font-semibold text-center mb-6">Iniciar Sesión</h2>
            
            <!-- Google Sign In Button -->
            <button id="google-login-btn" onclick="handleGoogleLogin()" 
                    class="btn-google w-full flex items-center justify-center gap-3 px-6 py-4 rounded-xl text-gray-800 font-semibold">
                <svg class="w-6 h-6" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continuar con Google
            </button>
            
            <!-- Divider -->
            <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-px bg-white/20"></div>
                <span class="text-gray-500 text-sm">o</span>
                <div class="flex-1 h-px bg-white/20"></div>
            </div>
            
            <!-- Email Login Form -->
            <form id="email-form" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Correo electrónico</label>
                    <input type="email" id="email" placeholder="tu@email.com"
                           class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl focus:outline-none focus:border-cyan-400 transition">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••"
                           class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl focus:outline-none focus:border-cyan-400 transition">
                </div>
                
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 rounded accent-cyan-400">
                        <span class="text-gray-400">Recordarme</span>
                    </label>
                    <a href="#" class="text-cyan-400 hover:underline">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-500 rounded-xl font-semibold hover:opacity-90 transition">
                    Iniciar Sesión
                </button>
            </form>
            
            <!-- Sign Up Link -->
            <p class="text-center text-gray-400 mt-6">
                ¿No tienes cuenta? 
                <a href="#" class="text-cyan-400 hover:underline">Regístrate aquí</a>
            </p>
        </div>
        
        <!-- Features -->
        <div class="mt-8 grid grid-cols-3 gap-4 text-center">
            <div class="card-glass rounded-xl p-4">
                <span class="text-2xl block mb-2">🧩</span>
                <p class="text-xs text-gray-400">Puzzles cooperativos</p>
            </div>
            <div class="card-glass rounded-xl p-4">
                <span class="text-2xl block mb-2">🌍</span>
                <p class="text-xs text-gray-400">Mundos procedurales</p>
            </div>
            <div class="card-glass rounded-xl p-4">
                <span class="text-2xl block mb-2">🏆</span>
                <p class="text-xs text-gray-400">Logros y estadísticas</p>
            </div>
        </div>
        
        <!-- Footer -->
        <p class="text-center text-gray-500 text-sm mt-8">
            Al iniciar sesión, aceptas nuestros 
            <a href="#" class="text-cyan-400 hover:underline">Términos</a> y 
            <a href="#" class="text-cyan-400 hover:underline">Privacidad</a>
        </p>
    </div>

    <script>
        // ============================================
        // FIREBASE AUTH CONFIGURATION
        // ============================================
        
        // TODO: Replace with your Firebase configuration
        // 1. Go to https://console.firebase.google.com/
        // 2. Create a new project
        // 3. Enable Google Auth in Authentication > Sign-in method
        // 4. Add your web app and copy the config below
        
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"

        // ============================================
        // GOOGLE SIGN IN
        // ============================================
        
        async function handleGoogleLogin() {
            // For demo purposes, simulate login
            // In production, uncomment the Firebase code below
            
            const btn = document.getElementById('google-login-btn');
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-gray-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Conectando...
            `;
            
            // Simulate login delay
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            // Redirect to dashboard
            window.location.href = 'dashboard.html';
            
            /*
            // ============================================
            // PRODUCTION CODE (Uncomment when Firebase is configured)
            // ============================================

            import { getAuth, signInWithPopup, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const provider = new GoogleAuthProvider();
            
            try {
                const result = await signInWithPopup(auth, provider);
                const credential = GoogleAuthProvider.credentialFromResult(result);
                const user = result.user;
                
                console.log('User signed in:', user.displayName);
                
                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error('Login error:', error);
                alert('Error al iniciar sesión: ' + error.message);
                
                btn.innerHTML = `
                    <svg class="w-6 h-6" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continuar con Google
                `;
            }
            */
        }
        
        // ============================================
        // EMAIL LOGIN (Placeholder)
        // ============================================
        
        document.getElementById('email-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert('Por favor completa todos los campos');
                return;
            }
            
            // Simulate login
            alert('En producción, esto usaría Firebase Auth con email/password');
            window.location.href = 'dashboard.html';
        });
        
        // ============================================
        // CHECK IF ALREADY LOGGED IN
        // ============================================
        
        // In production, check auth state and redirect if already logged in
        /*
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
        
        const auth = getAuth(app);
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Already logged in, redirect to dashboard
                window.location.href = 'dashboard.html';
            }
        });
        */
    </script>
</body>
</html>
