<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Forgotten Depths - Maze Puzzle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000; 
            font-family: 'Segoe UI', Tahoma, sans-serif;
            cursor: none;
        }
        canvas { display: block; }
        
        /* Crosshair */
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 1000;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.8);
        }
        #crosshair::before {
            left: 50%;
            top: 2px;
            bottom: 2px;
            width: 2px;
            transform: translateX(-50%);
        }
        #crosshair::after {
            top: 50%;
            left: 2px;
            right: 2px;
            height: 2px;
            transform: translateY(-50%);
        }
        
        /* Start Screen */
        #start-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        #start-screen h1 {
            font-size: 48px;
            color: #4fc3f7;
            text-shadow: 0 0 30px rgba(79,195,247,0.5);
            margin-bottom: 10px;
        }
        #start-screen .subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 30px;
        }
        #start-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 30px rgba(76,175,80,0.3);
        }
        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(76,175,80,0.5);
        }
        .controls-hint {
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }
        .controls-hint kbd {
            background: #333;
            padding: 3px 8px;
            border-radius: 4px;
            margin: 0 2px;
            color: #4fc3f7;
        }
        
        /* HUD */
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 100;
            pointer-events: none;
        }
        .hud-panel {
            background: rgba(0,0,0,0.7);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            backdrop-filter: blur(10px);
        }
        .hud-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 6px;
        }
        .hud-value {
            font-size: 18px;
            font-weight: bold;
            color: #4fc3f7;
        }
        
        /* FPS Counter */
        .fps-panel {
            border-color: rgba(100,200,100,0.4);
            background: rgba(0,30,0,0.7);
        }
        .fps-panel .hud-value {
            color: #4caf50;
        }
        
        /* Minimap */
        #minimap {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 10px;
            z-index: 100;
        }
        #minimap-canvas {
            display: block;
            border-radius: 4px;
        }
        .minimap-label {
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            text-align: center;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Puzzle Progress */
        #puzzle-progress {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .puzzle-item {
            background: rgba(0,0,0,0.7);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            font-size: 12px;
        }
        .puzzle-item.solved {
            border-color: #4caf50;
            background: rgba(76,175,80,0.2);
        }
        
        /* Time Panel */
        .time-panel {
            border-color: rgba(255,200,100,0.4);
            background: rgba(50,30,0,0.7);
        }
        .time-panel .hud-value {
            color: #ffcc00;
        }
        
        /* Notification */
        #notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            border: 2px solid #4caf50;
            border-radius: 15px;
            padding: 20px 40px;
            color: white;
            text-align: center;
            z-index: 1500;
            display: none;
            animation: fadeInOut 3s;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
        }
        #notification .notif-icon { font-size: 40px; }
        #notification .notif-title { font-size: 20px; font-weight: bold; margin: 10px 0; }
        #notification .notif-desc { color: #aaa; }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen">
        <h1>🏛️ The Forgotten Depths</h1>
        <p class="subtitle">Maze Puzzle Explorer</p>
        <button id="start-btn">Comenzar Exploración</button>
        <div class="controls-hint">
            <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Mover &nbsp;&nbsp;
            <kbd>Mouse</kbd> Mirar &nbsp;&nbsp;
            <kbd>E</kbd> Interactuar<br>
            <kbd>F</kbd> Linterna &nbsp;&nbsp;
            <kbd>J</kbd> Diario &nbsp;&nbsp;
            <kbd>1-4</kbd> Herramientas
        </div>
    </div>
    
    <!-- Crosshair -->
    <div id="crosshair"></div>
    
    <!-- HUD -->
    <div id="hud">
        <div class="hud-panel">
            <div class="hud-title">Nivel</div>
            <div class="hud-value" id="level-display">1</div>
        </div>
        <div class="hud-panel">
            <div class="hud-title">Secretos</div>
            <div class="hud-value"><span id="secrets-count">0</span> / <span id="total-secrets">5</span></div>
        </div>
        <div class="hud-panel">
            <div class="hud-title">Tiempo</div>
            <div class="hud-value" id="time-display">00:00</div>
        </div>
        <div class="hud-panel fps-panel">
            <div class="hud-title">FPS</div>
            <div class="hud-value" id="fps-display">60</div>
        </div>
    </div>
    
    <!-- Minimap -->
    <div id="minimap">
        <canvas id="minimap-canvas" width="120" height="120"></canvas>
        <div class="minimap-label">Mapa</div>
    </div>
    
    <!-- Puzzle Progress -->
    <div id="puzzle-progress">
        <div class="puzzle-item" id="puzzle-key">🔑 Llave</div>
        <div class="puzzle-item" id="puzzle-door">🚪 Puerta</div>
        <div class="puzzle-item" id="puzzle-light">💡 Luz</div>
        <div class="puzzle-item" id="puzzle-color">🎨 Color</div>
        <div class="puzzle-item" id="puzzle-plate">⬇️ Placa</div>
        <div class="puzzle-item" id="puzzle-rune">🔮 Runas</div>
        <div class="puzzle-item" id="puzzle-exit">🏃 Salida</div>
    </div>
    
    <!-- Notification -->
    <div id="notification">
        <div class="notif-icon">✨</div>
        <div class="notif-title">¡Secreto Encontrado!</div>
        <div class="notif-desc">Has descubierto algo oculto</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    // ============================================
    // THE FORGOTTEN DEPTHS - MAZE PUZZLE GAME
    // Lightweight, performant maze exploration
    // ============================================
    
    // --- CONSTANTS ---
    const MAZE_WIDTH = 15;
    const MAZE_HEIGHT = 15;
    const WALL_HEIGHT = 3;
    const WALL_THICKNESS = 0.3;
    const CELL_SIZE = 4;
    const PLAYER_HEIGHT = 1.6;
    const PLAYER_SPEED = 8;
    const PLAYER_SPRINT_SPEED = 12;
    const MOUSE_SENSITIVITY = 0.002;
    
    // --- GAME STATE ---
    let gameState = {
        running: false,
        level: 1,
        secretsFound: 0,
        totalSecrets: 5,
        hasKey: false,
        doorOpen: false,
        lightPuzzleSolved: false,
        colorPuzzleSolved: false,
        platePuzzleSolved: false,
        runePuzzleSolved: false,
        startTime: Date.now(),
        flashlightOn: true,
        currentCell: { x: 0, z: 0 }
    };
    
    // --- PUZZLE OBJECTS ---
    let lightPuzzle = null;
    let colorPuzzle = null;
    let platePuzzle = null;
    let runePuzzle = null;
    
    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    scene.fog = new THREE.Fog(0x1a1a2e, 10, 40);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, PLAYER_HEIGHT, 0);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = false;  // No shadows for performance
    document.body.appendChild(renderer.domElement);
    
    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
    scene.add(ambientLight);
    
    const flashlight = new THREE.SpotLight(0xffffcc, 2.0, 30, Math.PI / 4, 0.3, 1);
    flashlight.position.set(0, 0, 0);
    camera.add(flashlight);
    flashlight.target.position.set(0, 0, -1);
    camera.add(flashlight.target);
    scene.add(camera);
    
    // --- INPUT ---
    const keys = {};
    let yaw = 0;
    let pitch = 0;
    
    document.addEventListener('keydown', (e) => { keys[e.code] = true; });
    document.addEventListener('keyup', (e) => { keys[e.code] = false; });
    document.addEventListener('mousemove', (e) => {
        if (!gameState.running) return;
        yaw -= e.movementX * MOUSE_SENSITIVITY;
        pitch -= e.movementY * MOUSE_SENSITIVITY;
        pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
    });
    
    // --- FPS COUNTER ---
    let fps = 0;
    let frameCount = 0;
    let lastFpsUpdate = Date.now();
    
    function updateFPS() {
        frameCount++;
        const now = Date.now();
        if (now - lastFpsUpdate >= 1000) {
            fps = frameCount;
            frameCount = 0;
            lastFpsUpdate = now;
            document.getElementById('fps-display').textContent = fps;
        }
    }
    
    // --- MAZE GENERATION ---
    // Recursive backtracking algorithm
    function generateMaze(width, height) {
        // Initialize grid with walls
        const maze = [];
        for (let y = 0; y < height * 2 + 1; y++) {
            maze[y] = [];
            for (let x = 0; x < width * 2 + 1; x++) {
                maze[y][x] = 1; // 1 = wall
            }
        }
        
        // Carve paths
        function carve(cx, cy) {
            maze[cy * 2 + 1][cx * 2 + 1] = 0; // Mark cell as passage
            
            const directions = [
                [0, -1], // Up
                [1, 0],  // Right
                [0, 1],  // Down
                [-1, 0]  // Left
            ].sort(() => Math.random() - 0.5);
            
            for (const [dx, dy] of directions) {
                const nx = cx + dx;
                const ny = cy + dy;
                
                if (nx >= 0 && nx < width && ny >= 0 && ny < height && maze[ny * 2 + 1][nx * 2 + 1] === 1) {
                    maze[cy * 2 + 1 + dy][cx * 2 + 1 + dx] = 0; // Remove wall between cells
                    carve(nx, ny);
                }
            }
        }
        
        carve(0, 0);
        
        // Add some extra passages for loops (makes it less linear)
        for (let i = 0; i < width * height * 0.1; i++) {
            const x = Math.floor(Math.random() * (width - 1)) * 2 + 2;
            const y = Math.floor(Math.random() * (height - 1)) * 2 + 2;
            if (maze[y][x] === 1) {
                maze[y][x] = 0;
            }
        }
        
        return maze;
    }
    
    // --- MAZE RENDERING ---
    const wallMeshes = [];
    const secretLocations = [];
    let mazeData = null;
    
    function clearMaze() {
        wallMeshes.forEach(mesh => scene.remove(mesh));
        wallMeshes.length = 0;
        secretLocations.length = 0;
    }
    
    function buildMaze() {
        clearMaze();
        mazeData = generateMaze(MAZE_WIDTH, MAZE_HEIGHT);
        
        const wallGeometry = new THREE.BoxGeometry(WALL_THICKNESS, WALL_HEIGHT, CELL_SIZE);
        const wallGeometryH = new THREE.BoxGeometry(CELL_SIZE, WALL_HEIGHT, WALL_THICKNESS);
        
        // Wall materials with different colors
        const materials = [
            new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.8 }), // Brown stone
            new THREE.MeshStandardMaterial({ color: 0x6d4c41, roughness: 0.85 }), // Darker stone
            new THREE.MeshStandardMaterial({ color: 0x795548, roughness: 0.75 }), // Light stone
        ];
        
        // Add torch lights at random positions
        const torchPositions = [];
        
        for (let y = 0; y < mazeData.length; y++) {
            for (let x = 0; x < mazeData[y].length; x++) {
                if (mazeData[y][x] === 1) {
                    const worldX = (x - MAZE_WIDTH) * (CELL_SIZE / 2);
                    const worldZ = (y - MAZE_HEIGHT) * (CELL_SIZE / 2);
                    
                    // Determine wall orientation
                    const isHorizontal = (y > 0 && mazeData[y-1] && mazeData[y-1][x] === 0) || 
                                         (y < mazeData.length - 1 && mazeData[y+1] && mazeData[y+1][x] === 0);
                    
                    const material = materials[Math.floor(Math.random() * materials.length)];
                    const mesh = new THREE.Mesh(
                        isHorizontal ? wallGeometryH : wallGeometry,
                        material
                    );
                    mesh.position.set(worldX, WALL_HEIGHT / 2, worldZ);
                    scene.add(mesh);
                    wallMeshes.push(mesh);
                    
                    // Random torch
                    if (Math.random() < 0.03 && torchPositions.length < 15) {
                        torchPositions.push({ x: worldX, z: worldZ });
                        const light = new THREE.PointLight(0xff6600, 1.5, 8);
                        light.position.set(worldX, WALL_HEIGHT - 0.5, worldZ);
                        scene.add(light);
                        wallMeshes.push(light); // Add to cleanup array
                    }
                    
                    // Random secret location
                    if (Math.random() < 0.01 && secretLocations.length < gameState.totalSecrets) {
                        secretLocations.push({ 
                            x: worldX, 
                            z: worldZ, 
                            found: false,
                            type: ['gem', 'scroll', 'key'][Math.floor(Math.random() * 3)]
                        });
                    }
                }
            }
        }
        
        // Place key at random dead end
        placeKeyAndDoor();
        
        // Place new puzzles
        createLightPuzzle();
        createColorPuzzle();
        createPlatePuzzle();
        createRunePuzzle();
        
        // Place exit
        placeExit();
        
        // Set player start position
        camera.position.set(-MAZE_WIDTH * (CELL_SIZE/2) + CELL_SIZE/2, PLAYER_HEIGHT, -MAZE_HEIGHT * (CELL_SIZE/2) + CELL_SIZE/2);
        
        // Update HUD
        document.getElementById('total-secrets').textContent = gameState.totalSecrets;
        updateMinimap();
    }
    
    // --- KEY AND DOOR ---
    let keyPosition = null;
    let doorPosition = null;
    let exitPosition = null;
    let keyMesh = null;
    let doorMesh = null;
    let exitMesh = null;
    
    function placeKeyAndDoor() {
        // Find a dead end for the key
        const deadEnds = findDeadEnds();
        if (deadEnds.length > 0) {
            const keyCell = deadEnds[Math.floor(Math.random() * deadEnds.length)];
            keyPosition = cellToWorld(keyCell.x, keyCell.y);
            
            // Create key mesh (glowing cube)
            const keyGeom = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const keyMat = new THREE.MeshStandardMaterial({ 
                color: 0xffd700, 
                emissive: 0xffd700, 
                emissiveIntensity: 0.5 
            });
            keyMesh = new THREE.Mesh(keyGeom, keyMat);
            keyMesh.position.set(keyPosition.x, 0.5, keyPosition.z);
            scene.add(keyMesh);
        }
        
        // Place door at another location
        if (deadEnds.length > 1) {
            const doorCell = deadEnds[Math.floor(Math.random() * deadEnds.length)];
            doorPosition = cellToWorld(doorCell.x, doorCell.y);
            
            // Create door mesh
            const doorGeom = new THREE.BoxGeometry(CELL_SIZE * 0.8, WALL_HEIGHT * 0.9, 0.2);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
            doorMesh = new THREE.Mesh(doorGeom, doorMat);
            doorMesh.position.set(doorPosition.x, WALL_HEIGHT * 0.45, doorPosition.z);
            scene.add(doorMesh);
        }
    }
    
    function placeExit() {
        // Place exit at far corner
        exitPosition = cellToWorld(MAZE_WIDTH - 1, MAZE_HEIGHT - 1);
        
        const exitGeom = new THREE.RingGeometry(1, 1.3, 32);
        const exitMat = new THREE.MeshBasicMaterial({ 
            color: 0x00ff00, 
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.7
        });
        exitMesh = new THREE.Mesh(exitGeom, exitMat);
        exitMesh.rotation.x = -Math.PI / 2;
        exitMesh.position.set(exitPosition.x, 0.1, exitPosition.z);
        scene.add(exitMesh);
    }
    
    // --- LIGHT BEAM PUZZLE ---
    function createLightPuzzle() {
        const deadEnds = findDeadEnds();
        if (deadEnds.length < 3) return;
        
        const puzzleCell = deadEnds[Math.floor(Math.random() * deadEnds.length)];
        const puzzlePos = cellToWorld(puzzleCell.x, puzzleCell.y);
        
        // Light source (emitter)
        const emitterGeom = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const emitterMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00, emissiveIntensity: 1 });
        const emitter = new THREE.Mesh(emitterGeom, emitterMat);
        emitter.position.set(puzzlePos.x - 1.5, 1, puzzlePos.z);
        scene.add(emitter);
        
        // Light beam (visual)
        const beamGeom = new THREE.CylinderGeometry(0.05, 0.05, 3, 8);
        const beamMat = new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.6 });
        const beam = new THREE.Mesh(beamGeom, beamMat);
        beam.rotation.z = Math.PI / 2;
        beam.position.set(puzzlePos.x, 1, puzzlePos.z);
        scene.add(beam);
        
        // Target (receiver)
        const targetGeom = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const targetMat = new THREE.MeshStandardMaterial({ color: 0x444444, emissive: 0x444444, emissiveIntensity: 0.2 });
        const target = new THREE.Mesh(targetGeom, targetMat);
        target.position.set(puzzlePos.x + 1.5, 1, puzzlePos.z);
        scene.add(target);
        
        // Mirror (player rotates to solve)
        const mirrorGeom = new THREE.BoxGeometry(0.1, 0.8, 0.8);
        const mirrorMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, emissive: 0x4488ff, emissiveIntensity: 0.3, metalness: 0.9 });
        const mirror = new THREE.Mesh(mirrorGeom, mirrorMat);
        mirror.position.set(puzzlePos.x, 1, puzzlePos.z);
        scene.add(mirror);
        
        lightPuzzle = {
            position: puzzlePos,
            emitter: emitter,
            beam: beam,
            target: target,
            mirror: mirror,
            solved: false,
            mirrorAngle: 0
        };
    }
    
    // --- COLOR SEQUENCE PUZZLE ---
    function createColorPuzzle() {
        const deadEnds = findDeadEnds();
        if (deadEnds.length < 3) return;
        
        const puzzleCell = deadEnds[Math.floor(Math.random() * deadEnds.length)];
        const puzzlePos = cellToWorld(puzzleCell.x, puzzleCell.y);
        
        const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00];
        const colorNames = ['Rojo', 'Verde', 'Azul', 'Amarillo'];
        const correctOrder = [0, 2, 1, 3]; // Random correct order
        
        const crystals = [];
        for (let i = 0; i < 4; i++) {
            const crystalGeom = new THREE.OctahedronGeometry(0.3);
            const crystalMat = new THREE.MeshStandardMaterial({ 
                color: colors[i], 
                emissive: colors[i], 
                emissiveIntensity: 0.5 
            });
            const crystal = new THREE.Mesh(crystalGeom, crystalMat);
            crystal.position.set(puzzlePos.x - 1.5 + i, 1, puzzlePos.z);
            crystal.userData = { colorIndex: i, activated: false };
            scene.add(crystal);
            crystals.push(crystal);
        }
        
        colorPuzzle = {
            position: puzzlePos,
            crystals: crystals,
            correctOrder: correctOrder,
            currentSequence: [],
            solved: false
        };
    }
    
    // --- PRESSURE PLATE PUZZLE ---
    function createPlatePuzzle() {
        const deadEnds = findDeadEnds();
        if (deadEnds.length < 3) return;
        
        const puzzleCell = deadEnds[Math.floor(Math.random() * deadEnds.length)];
        const puzzlePos = cellToWorld(puzzleCell.x, puzzleCell.y);
        
        const plateColors = [0xff4444, 0x44ff44, 0x4444ff];
        const plates = [];
        const correctOrder = [0, 1, 2];
        
        for (let i = 0; i < 3; i++) {
            const plateGeom = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            const plateMat = new THREE.MeshStandardMaterial({ 
                color: plateColors[i], 
                emissive: plateColors[i], 
                emissiveIntensity: 0.3 
            });
            const plate = new THREE.Mesh(plateGeom, plateMat);
            plate.position.set(puzzlePos.x - 1 + i, 0.05, puzzlePos.z);
            plate.userData = { plateIndex: i, activated: false };
            scene.add(plate);
            plates.push(plate);
        }
        
        platePuzzle = {
            position: puzzlePos,
            plates: plates,
            correctOrder: correctOrder,
            currentSequence: [],
            solved: false
        };
    }
    
    // --- RUNE PUZZLE ---
    function createRunePuzzle() {
        const deadEnds = findDeadEnds();
        if (deadEnds.length < 3) return;
        
        const puzzleCell = deadEnds[Math.floor(Math.random() * deadEnds.length)];
        const puzzlePos = cellToWorld(puzzleCell.x, puzzleCell.y);
        
        const runeSymbols = ['⊕', '⊖', '⊗', '⊘'];
        const runes = [];
        
        for (let i = 0; i < 4; i++) {
            // Create rune stone
            const runeGeom = new THREE.BoxGeometry(0.6, 1.2, 0.3);
            const runeMat = new THREE.MeshStandardMaterial({ 
                color: 0x666666, 
                roughness: 0.8 
            });
            const rune = new THREE.Mesh(runeGeom, runeMat);
            rune.position.set(puzzlePos.x - 1.5 + i, 0.6, puzzlePos.z);
            
            // Add glowing symbol
            const symbolGeom = new THREE.PlaneGeometry(0.4, 0.4);
            const symbolMat = new THREE.MeshBasicMaterial({ 
                color: 0x9944ff, 
                transparent: true, 
                opacity: 0.8,
                side: THREE.DoubleSide
            });
            const symbol = new THREE.Mesh(symbolGeom, symbolMat);
            symbol.position.set(0, 0, 0.16);
            rune.add(symbol);
            
            rune.userData = { runeIndex: i, symbol: runeSymbols[i], activated: false };
            scene.add(rune);
            runes.push(rune);
        }
        
        runePuzzle = {
            position: puzzlePos,
            runes: runes,
            correctSequence: [0, 2, 1, 3],
            currentSequence: [],
            solved: false
        };
    }
    
    function findDeadEnds() {
        const deadEnds = [];
        for (let y = 1; y < mazeData.length - 1; y += 2) {
            for (let x = 1; x < mazeData[y].length - 1; x += 2) {
                if (mazeData[y][x] === 0) {
                    let walls = 0;
                    if (mazeData[y-1][x] === 1) walls++;
                    if (mazeData[y+1][x] === 1) walls++;
                    if (mazeData[y][x-1] === 1) walls++;
                    if (mazeData[y][x+1] === 1) walls++;
                    if (walls >= 3) {
                        deadEnds.push({ x: Math.floor(x/2), y: Math.floor(y/2) });
                    }
                }
            }
        }
        return deadEnds;
    }
    
    function cellToWorld(cellX, cellY) {
        return {
            x: (cellX - MAZE_WIDTH/2) * CELL_SIZE + CELL_SIZE/2,
            z: (cellY - MAZE_HEIGHT/2) * CELL_SIZE + CELL_SIZE/2
        };
    }
    
    // --- MINIMAP ---
    function updateMinimap() {
        const canvas = document.getElementById('minimap-canvas');
        const ctx = canvas.getContext('2d');
        const scale = canvas.width / (mazeData[0].length + 2);
        
        ctx.fillStyle = '#0a0a1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Draw maze
        for (let y = 0; y < mazeData.length; y++) {
            for (let x = 0; x < mazeData[y].length; x++) {
                if (mazeData[y][x] === 1) {
                    ctx.fillStyle = '#5d4037';
                } else {
                    ctx.fillStyle = '#1a1a2e';
                }
                ctx.fillRect(x * scale, y * scale, scale, scale);
            }
        }
        
        // Draw player
        const playerX = (camera.position.x / CELL_SIZE + MAZE_WIDTH/2 + 0.5) * scale;
        const playerZ = (camera.position.z / CELL_SIZE + MAZE_HEIGHT/2 + 0.5) * scale;
        ctx.fillStyle = '#4fc3f7';
        ctx.beginPath();
        ctx.arc(playerX, playerZ, 3, 0, Math.PI * 2);
        ctx.fill();
        
        // Draw key if not collected
        if (keyPosition && !gameState.hasKey) {
            const keyX = (keyPosition.x / CELL_SIZE + MAZE_WIDTH/2 + 0.5) * scale;
            const keyZ = (keyPosition.z / CELL_SIZE + MAZE_HEIGHT/2 + 0.5) * scale;
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(keyX, keyZ, 2, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Draw exit
        if (exitPosition) {
            const exitX = (exitPosition.x / CELL_SIZE + MAZE_WIDTH/2 + 0.5) * scale;
            const exitZ = (exitPosition.z / CELL_SIZE + MAZE_HEIGHT/2 + 0.5) * scale;
            ctx.fillStyle = '#00ff00';
            ctx.beginPath();
            ctx.arc(exitX, exitZ, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    // --- COLLISION DETECTION ---
    function checkCollision(x, z) {
        // Convert world position to maze grid
        const gridX = Math.floor(x / CELL_SIZE + MAZE_WIDTH/2 + 0.5);
        const gridZ = Math.floor(z / CELL_SIZE + MAZE_HEIGHT/2 + 0.5);
        
        // Check bounds
        if (gridX < 0 || gridX >= mazeData[0].length || gridZ < 0 || gridZ >= mazeData.length) {
            return true;
        }
        
        return mazeData[gridZ][gridX] === 1;
    }
    
    // --- PLAYER MOVEMENT ---
    function updatePlayer(delta) {
        if (!gameState.running) return;
        
        const speed = keys['ShiftLeft'] ? PLAYER_SPRINT_SPEED : PLAYER_SPEED;
        const forward = new THREE.Vector3(0, 0, -1);
        forward.applyQuaternion(camera.quaternion);
        forward.y = 0;
        forward.normalize();
        
        const right = new THREE.Vector3(1, 0, 0);
        right.applyQuaternion(camera.quaternion);
        right.y = 0;
        right.normalize();
        
        const moveDir = new THREE.Vector3();
        
        if (keys['KeyW']) moveDir.add(forward);
        if (keys['KeyS']) moveDir.sub(forward);
        if (keys['KeyD']) moveDir.add(right);
        if (keys['KeyA']) moveDir.sub(right);
        
        if (moveDir.length() > 0) {
            moveDir.normalize();
            
            const newX = camera.position.x + moveDir.x * speed * delta;
            const newZ = camera.position.z + moveDir.z * speed * delta;
            
            // Check collision with sliding
            if (!checkCollision(newX, camera.position.z)) {
                camera.position.x = newX;
            }
            if (!checkCollision(camera.position.x, newZ)) {
                camera.position.z = newZ;
            }
        }
        
        // Keep player at correct height
        camera.position.y = PLAYER_HEIGHT;
    }
    
    // --- INTERACTION ---
    function checkInteractions() {
        // Check key pickup
        if (keyPosition && !gameState.hasKey) {
            const dist = camera.position.distanceTo(new THREE.Vector3(keyPosition.x, PLAYER_HEIGHT, keyPosition.z));
            if (dist < 1.5) {
                gameState.hasKey = true;
                scene.remove(keyMesh);
                showNotification('🔑', '¡Llave Encontrada!', 'Ahora puedes abrir la puerta');
                document.getElementById('puzzle-key').classList.add('solved');
            }
        }
        
        // Check door
        if (doorPosition && gameState.hasKey && !gameState.doorOpen) {
            const dist = camera.position.distanceTo(new THREE.Vector3(doorPosition.x, PLAYER_HEIGHT, doorPosition.z));
            if (dist < 2) {
                gameState.doorOpen = true;
                scene.remove(doorMesh);
                showNotification('🚪', '¡Puerta Abierta!', 'El camino está libre');
                document.getElementById('puzzle-door').classList.add('solved');
            }
        }
        
        // Check light puzzle (press E near mirror)
        if (lightPuzzle && !lightPuzzle.solved && gameState.running) {
            const dist = camera.position.distanceTo(new THREE.Vector3(lightPuzzle.position.x, PLAYER_HEIGHT, lightPuzzle.position.z));
            if (dist < 2 && keys['KeyE']) {
                lightPuzzle.mirrorAngle += Math.PI / 4;
                lightPuzzle.mirror.rotation.y = lightPuzzle.mirrorAngle;
                
                // Check if beam hits target (angle should be 0 or PI)
                if (lightPuzzle.mirrorAngle >= Math.PI * 2) {
                    lightPuzzle.solved = true;
                    gameState.lightPuzzleSolved = true;
                    lightPuzzle.target.material.emissive.setHex(0x00ff00);
                    lightPuzzle.target.material.emissiveIntensity = 1;
                    showNotification('💡', '¡Puzzle de Luz Resuelto!', 'El rayo alcanza el objetivo');
                    document.getElementById('puzzle-light').classList.add('solved');
                }
            }
        }
        
        // Check color puzzle (press E near crystals)
        if (colorPuzzle && !colorPuzzle.solved && gameState.running) {
            colorPuzzle.crystals.forEach((crystal, index) => {
                const dist = camera.position.distanceTo(new THREE.Vector3(crystal.position.x, PLAYER_HEIGHT, crystal.position.z));
                if (dist < 1.5 && keys['KeyE'] && !crystal.userData.activated) {
                    crystal.userData.activated = true;
                    crystal.material.emissiveIntensity = 1;
                    colorPuzzle.currentSequence.push(crystal.userData.colorIndex);
                    
                    // Check sequence
                    const isCorrect = colorPuzzle.currentSequence.every((val, i) => val === colorPuzzle.correctOrder[i]);
                    if (!isCorrect) {
                        // Reset
                        colorPuzzle.currentSequence = [];
                        colorPuzzle.crystals.forEach(c => {
                            c.userData.activated = false;
                            c.material.emissiveIntensity = 0.5;
                        });
                        showNotification('🎨', 'Secuencia Incorrecta', 'Intenta de nuevo');
                    } else if (colorPuzzle.currentSequence.length === colorPuzzle.correctOrder.length) {
                        colorPuzzle.solved = true;
                        gameState.colorPuzzleSolved = true;
                        showNotification('🎨', '¡Puzzle de Color Resuelto!', 'Secuencia correcta');
                        document.getElementById('puzzle-color').classList.add('solved');
                    }
                }
            });
        }
        
        // Check plate puzzle (step on plates)
        if (platePuzzle && !platePuzzle.solved && gameState.running) {
            platePuzzle.plates.forEach((plate, index) => {
                const dist = camera.position.distanceTo(new THREE.Vector3(plate.position.x, PLAYER_HEIGHT, plate.position.z));
                if (dist < 1 && !plate.userData.activated) {
                    plate.userData.activated = true;
                    plate.position.y = 0.02; // Press down
                    platePuzzle.currentSequence.push(plate.userData.plateIndex);
                    
                    // Check sequence
                    const isCorrect = platePuzzle.currentSequence.every((val, i) => val === platePuzzle.correctOrder[i]);
                    if (!isCorrect) {
                        // Reset
                        platePuzzle.currentSequence = [];
                        platePuzzle.plates.forEach(p => {
                            p.userData.activated = false;
                            p.position.y = 0.05;
                        });
                        showNotification('⬇️', 'Secuencia Incorrecta', 'Pisa las placas en orden');
                    } else if (platePuzzle.currentSequence.length === platePuzzle.correctOrder.length) {
                        platePuzzle.solved = true;
                        gameState.platePuzzleSolved = true;
                        showNotification('⬇️', '¡Puzzle de Placas Resuelto!', 'Orden correcto');
                        document.getElementById('puzzle-plate').classList.add('solved');
                    }
                }
            });
        }
        
        // Check rune puzzle (press E near runes)
        if (runePuzzle && !runePuzzle.solved && gameState.running) {
            runePuzzle.runes.forEach((rune, index) => {
                const dist = camera.position.distanceTo(new THREE.Vector3(rune.position.x, PLAYER_HEIGHT, rune.position.z));
                if (dist < 1.5 && keys['KeyE'] && !rune.userData.activated) {
                    rune.userData.activated = true;
                    rune.children[0].material.color.setHex(0x00ff00);
                    runePuzzle.currentSequence.push(rune.userData.runeIndex);
                    
                    // Check sequence
                    const isCorrect = runePuzzle.currentSequence.every((val, i) => val === runePuzzle.correctSequence[i]);
                    if (!isCorrect) {
                        // Reset
                        runePuzzle.currentSequence = [];
                        runePuzzle.runes.forEach(r => {
                            r.userData.activated = false;
                            r.children[0].material.color.setHex(0x9944ff);
                        });
                        showNotification('🔮', 'Secuencia Incorrecta', 'Activa las runas en orden');
                    } else if (runePuzzle.currentSequence.length === runePuzzle.correctSequence.length) {
                        runePuzzle.solved = true;
                        gameState.runePuzzleSolved = true;
                        showNotification('🔮', '¡Puzzle de Runas Resuelto!', 'Secuencia correcta');
                        document.getElementById('puzzle-rune').classList.add('solved');
                    }
                }
            });
        }
        
        // Check exit
        if (exitPosition) {
            const dist = camera.position.distanceTo(new THREE.Vector3(exitPosition.x, PLAYER_HEIGHT, exitPosition.z));
            if (dist < 2) {
                showNotification('🏃', '¡Nivel Completado!', `Tiempo: ${formatTime(Date.now() - gameState.startTime)}`);
                setTimeout(() => {
                    gameState.level++;
                    gameState.hasKey = false;
                    gameState.doorOpen = false;
                    gameState.secretsFound = 0;
                    document.getElementById('level-display').textContent = gameState.level;
                    document.querySelectorAll('.puzzle-item').forEach(el => el.classList.remove('solved'));
                    buildMaze();
                }, 3000);
            }
        }
        
        // Check secrets
        secretLocations.forEach((secret, index) => {
            if (!secret.found) {
                const dist = camera.position.distanceTo(new THREE.Vector3(secret.x, PLAYER_HEIGHT, secret.z));
                if (dist < 1.5) {
                    secret.found = true;
                    gameState.secretsFound++;
                    document.getElementById('secrets-count').textContent = gameState.secretsFound;
                    showNotification('✨', '¡Secreto Encontrado!', `Has descubierto un ${secret.type}`);
                }
            }
        });
    }
    
    // --- NOTIFICATION ---
    function showNotification(icon, title, desc) {
        const notif = document.getElementById('notification');
        notif.querySelector('.notif-icon').textContent = icon;
        notif.querySelector('.notif-title').textContent = title;
        notif.querySelector('.notif-desc').textContent = desc;
        notif.style.display = 'block';
        notif.style.animation = 'none';
        notif.offsetHeight; // Trigger reflow
        notif.style.animation = 'fadeInOut 3s';
        setTimeout(() => { notif.style.display = 'none'; }, 3000);
    }
    
    // --- TIME DISPLAY ---
    function formatTime(ms) {
        const seconds = Math.floor(ms / 1000);
        const minutes = Math.floor(seconds / 60);
        return `${minutes.toString().padStart(2, '0')}:${(seconds % 60).toString().padStart(2, '0')}`;
    }
    
    function updateTime() {
        if (gameState.running) {
            document.getElementById('time-display').textContent = formatTime(Date.now() - gameState.startTime);
        }
    }
    
    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();
    
    function animate() {
        requestAnimationFrame(animate);
        
        const delta = Math.min(clock.getDelta(), 0.1);
        
        updateFPS();
        updatePlayer(delta);
        checkInteractions();
        updateTime();
        updateMinimap();
        
        // Animate key
        if (keyMesh && !gameState.hasKey) {
            keyMesh.rotation.y += delta * 2;
            keyMesh.position.y = 0.5 + Math.sin(Date.now() * 0.003) * 0.1;
        }
        
        // Animate exit
        if (exitMesh) {
            exitMesh.rotation.z += delta;
        }
        
        renderer.render(scene, camera);
    }
    
    // --- EVENT LISTENERS ---
    document.addEventListener('click', () => {
        if (gameState.running) {
            renderer.domElement.requestPointerLock();
        }
    });
    
    document.addEventListener('pointerlockchange', () => {
        if (!document.pointerLockElement) {
            // Paused
        }
    });
    
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.code === 'KeyF' && gameState.running) {
            gameState.flashlightOn = !gameState.flashlightOn;
            flashlight.intensity = gameState.flashlightOn ? 2.0 : 0;
        }
    });
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // --- START GAME ---
    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('start-screen').style.display = 'none';
        gameState.running = true;
        gameState.startTime = Date.now();
        buildMaze();
        renderer.domElement.requestPointerLock();
    });
    
    // Start animation loop
    animate();
    </script>
</body>
